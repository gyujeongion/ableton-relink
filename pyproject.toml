[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ableton-relink"
version = "0.1.0"
description = "Find and relink the missing samples of Ableton Live sets (local folders or a remote machine over SSH)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
keywords = ["ableton", "ableton-live", "missing-files", "samples", "als", "relink"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio",
]

[project.scripts]
ableton-relink = "ableton_relink:main"

[tool.setuptools]
py-modules = ["ableton_relink"]
